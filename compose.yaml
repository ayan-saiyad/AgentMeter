name: agentmeter

x-app-environment: &app-environment
  NODE_ENV: development
  DATABASE_URL: postgresql://agentmeter:agentmeter@postgres:5432/agentmeter?schema=public
  REDIS_URL: redis://redis:6379
  API_KEY_PEPPER: local-development-pepper-change-me

x-app: &app
  build:
    context: .
  init: true
  restart: unless-stopped
  environment: *app-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentmeter
      POSTGRES_PASSWORD: agentmeter
      POSTGRES_USER: agentmeter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentmeter -d agentmeter"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  provider-simulator:
    <<: *app
    command:
      ["npm", "run", "start", "--workspace", "@agentmeter/provider-simulator"]
    environment:
      <<: *app-environment
      SIMULATOR_PORT: 4100
    ports:
      - "4100:4100"

  gateway:
    <<: *app
    command: ["npm", "run", "start", "--workspace", "@agentmeter/gateway"]
    environment:
      <<: *app-environment
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 4000
      LEASE_RENEW_MS: 30000
      LEASE_TTL_MS: 90000
      LIVE_EVENT_RETENTION: 1000
      SIMULATOR_URL: http://provider-simulator:4100
    depends_on:
      postgres:
        condition: service_healthy
      provider-simulator:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  worker:
    <<: *app
    command: ["npm", "run", "start", "--workspace", "@agentmeter/worker"]
    environment:
      <<: *app-environment
      LEASE_SWEEP_MS: 5000
      RECONCILIATION_DEADLINE_MS: 86400000
      SIMULATOR_URL: http://provider-simulator:4100
      WORKER_POLL_MS: 1000

  dashboard:
    <<: *app
    command:
      ["node", "apps/dashboard/.next/standalone/apps/dashboard/server.js"]
    environment:
      <<: *app-environment
      ADMIN_TOKEN: local-dashboard-token-change-me-now
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
