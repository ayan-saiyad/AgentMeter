apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentmeter
resources:
  - ../../base
  - data-services.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: agentmeter-secrets
    literals:
      - ADMIN_TOKEN=local-dashboard-token-change-me-now
      - API_KEY_PEPPER=local-development-pepper-change-me
      - DATABASE_URL=postgresql://agentmeter:agentmeter@postgres:5432/agentmeter?schema=public
      - REDIS_URL=redis://redis:6379
