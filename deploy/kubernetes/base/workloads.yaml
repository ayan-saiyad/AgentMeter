---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
    spec:
      serviceAccountName: dashboard
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: agentmeter
          imagePullPolicy: IfNotPresent
          command:
            ["node", "apps/dashboard/.next/standalone/apps/dashboard/server.js"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOSTNAME
              value: "0.0.0.0"
          envFrom:
            - configMapRef:
                name: agentmeter-config
            - secretRef:
                name: agentmeter-secrets
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: provider-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provider-simulator
    spec:
      serviceAccountName: provider-simulator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provider-simulator
          image: agentmeter
          imagePullPolicy: IfNotPresent
          command:
            [
              "npm",
              "run",
              "start",
              "--workspace",
              "@agentmeter/provider-simulator",
            ]
          ports:
            - name: http
              containerPort: 4100
          envFrom:
            - configMapRef:
                name: agentmeter-config
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
