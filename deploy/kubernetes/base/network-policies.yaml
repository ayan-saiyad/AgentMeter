apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-services
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [gateway, dashboard]
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { protocol: TCP, port: 3000 }
        - { protocol: TCP, port: 4000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: simulator-from-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: provider-simulator
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [gateway, worker]
      ports:
        - { protocol: TCP, port: 4100 }
