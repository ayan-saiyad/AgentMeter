apiVersion: v1
kind: Secret
metadata:
  name: agentmeter-secrets
  namespace: agentmeter
type: Opaque
stringData:
  ADMIN_TOKEN: replace-with-at-least-32-characters
  API_KEY_PEPPER: replace-with-at-least-32-characters
  DATABASE_URL: postgresql://user:password@database.example:5432/agentmeter?schema=public
  REDIS_URL: redis://redis.example:6379
