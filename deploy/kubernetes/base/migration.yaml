apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: worker
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migration
          image: agentmeter
          imagePullPolicy: IfNotPresent
          command: ["npm", "run", "db:deploy"]
          envFrom:
            - configMapRef:
                name: agentmeter-config
            - secretRef:
                name: agentmeter-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
