apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentmeter
spec:
  ingressClassName: nginx
  rules:
    - host: agentmeter.local
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 4000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port: { number: 3000 }
